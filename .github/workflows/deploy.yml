# Workflow для БУДУЩЕГО репозитория охранного сайта (ветка-заготовка живёт
# в gps24-es, где main = боевой gps24.es — эту ветку в main НЕ мёржить).
# Деплой-джоб срабатывает ТОЛЬКО с main; PR-джоб делает build + i18n-parity.
# ⚠ Перед первым релизом в новом репо: Settings → Pages → Source «GitHub Actions».
name: Build & Deploy (Pages)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check i18n keys parity # ui.es/en/ru.json — одинаковые наборы ключей
        run: node scripts/check-i18n.mjs
      - uses: withastro/action@v3 # npm ci + astro build → dist/
  deploy:
    if: github.ref == 'refs/heads/main' # деплой только с main
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
